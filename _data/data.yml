profile:
  show: true
  order: 1
  title: درباره من (Profile)
  description: |
    من یک مهندس امنیت سایبری با تمرکز بر هک اخلاقی (Ethical Hacking)، امنیت شبکه و برنامه‌نویسی پایتون هستم. 

    هدف من طراحی و پیاده‌سازی زیرساخت‌های امن و شناسایی آسیب‌پذیری‌ها قبل از سوءاستفاده مهاجمان است. در این وب‌سایت می‌توانید پروژه‌های شخصی، گزارش‌های تست نفوذ و مهارت‌های فنی من را مشاهده کنید.

experience:
  show: true
  order: 2
  title: سوابق کاری (Experiences)
  description: |
    در این بخش، سابقه‌های کاری، پروژه‌های شغلی و دستاوردهای من در زمینه امنیت شبکه و برنامه‌نویسی آورده شده است.

  items:
    - company: H.Arch Security
      link: 'https://harch-sec.github.io'
      tags: Freelance
      date: 2023 - Present
      role: Cyber Security Engineer
      location: Remote
      description: |
        ارائه خدمات مشاوره امنیتی و تست نفوذ.
        + انجام تست‌های نفوذ به وب‌سایت‌ها و شبکه‌ها.
        + تحلیل آسیب‌پذیری‌ها و ارائه راهکارهای امنیتی.

    - company: Previous Company
      link:
      tags: Full-time
      date: 2021 - 2023
      role: Python Developer
      location: Tehran
      description: |
        توسعه اسکریپت‌های امنیتی و اتوماسیون.
        + نوشتن ابزارهای اتوماسیون با پایتون.
        + مدیریت سرورهای لینوکس.

project:
  show: true
  order: 3
  title: پروژه‌ها (Projects)
  description: |
    بخش پروژه‌ها، مهم‌ترین بخش رزومه یک متخصص امنیت است. در اینجا می‌توانید توانایی‌های عملی خود را به نمایش بگذارید.

  items:
    - name: Python Network Scanner
      link: 'https://github.com/harch-sec'
      tags: Python, Networking
      date: 2023
      description: |
        یک اسکنر شبکه ساده و سریع با استفاده از پایتون برای شناسایی دستگاه‌های فعال در شبکه.
        + استفاده از کتابخانه‌های Scapy و Socket.
        + خروجی به فرمت JSON.

    - name: TryHackMe Writeups
      link: 'https://tryhackme.com/p/harch-sec'
      tags: Ethical Hacking, CTF
      date: 2022 - Present
      description: |
        مستندسازی و گزارش‌نویسی چالش‌های هک اخلاقی در پلتفرم TryHackMe.
        + حل چالش‌های وب و شبکه.
        + نوشتن راهنمای گام‌به‌گام برای مبتدیان.

