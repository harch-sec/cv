<style>

.sig-stage{position:relative;z-index:3;width:min(94vw,740px);min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.sig-astrolabe{width:min(76vw,430px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:4px 0 -5px;perspective:1000px}

.sig-ring.r2{inset:15%;transform:rotateY(66deg) rotateZ(28deg);border-color:rgba(203,218,229,.34);animation:sig-orbit2 23s linear infinite}
